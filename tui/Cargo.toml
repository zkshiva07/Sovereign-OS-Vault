[package]
name = "sovereign-os-vault"
version = "0.2.0"
edition = "2021"
description = "Kernel-hardened Solana signer for the laptop you already own"
license = "MIT OR Apache-2.0"

[lib]
name = "sovereign_os_vault"
path = "src/lib.rs"

[[bin]]
name = "sovereign-vault"
path = "src/main.rs"

[dependencies]
# TUI
ratatui   = "0.29"
crossterm = "0.28"

# Process hardening (raw libc syscalls)
libc = "0.2"

# Solana — signing + tx inspection (offline, no RPC required for v1)
solana-sdk     = "2.1"
solana-program = "2.1"

# Serialization
bincode    = "1.3"
bs58       = "0.5"
base64     = "0.22"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto for keystore at-rest encryption
chacha20poly1305 = "0.10"
argon2           = "0.5"
zeroize          = { version = "1.8", features = ["zeroize_derive"] }
rand             = "0.8"

# Utils
dirs   = "5.0"
anyhow = "1.0"
hex    = "0.4"

# QR code rendering for the Signing screen (Vultisig MPC handshake)
qrcode = { version = "0.14", default-features = false }

# FROST 2-of-2 ed25519 — Telegram-bot cosigner (v0.4 MPC backend)
frost-ed25519       = "2.2"
ed25519-dalek       = "2.2"
sovereign-frost-bot = { path = "../frost-bot" }
reqwest             = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# PNG steganography for FROST share camouflage / recovery (v0.4)
image = { version = "0.25", default-features = false, features = ["png"] }
toml  = "0.8"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto       = true
strip     = true
panic     = "abort"
