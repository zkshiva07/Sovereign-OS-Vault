[package]
name = "sovereign-frost-bot"
version = "0.4.0-dev"
edition = "2021"
description = "Telegram-bot cosigner for Sovereign OS Vault — 2-of-2 FROST ed25519"
license = "MIT OR Apache-2.0"

[[bin]]
name = "frost-bot"
path = "src/main.rs"

[[bin]]
name = "frost-keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "frost-laptop-sim"
path = "src/bin/laptop_sim.rs"

[dependencies]
# FROST + curve
frost-ed25519 = "2.2"
ed25519-dalek = "2.2"

# Telegram bot
teloxide = { version = "0.13", features = ["macros"] }

# HTTP server (laptop ↔ bot protocol)
axum   = "0.7"
tokio  = { version = "1", features = ["full"] }
tower  = "0.5"

# HTTP client (laptop sim)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bincode    = "1.3"
toml       = "0.8"
hex        = "0.4"
bs58       = "0.5"
base64     = "0.22"

# Logging + errors
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"

# Random
rand = "0.8"
